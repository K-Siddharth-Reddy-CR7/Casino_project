<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
            },
            colors: {
              casino: {
                900: '#020617', 
                800: '#0f172a', 
                700: '#1e293b', 
                gold: '#a78bfa',
                red: '#fb7185', 
                green: '#34d399',
                accent: '#818cf8', 
              },
              navy: {
                950: '#020617',
                900: '#0f172a',
                800: '#1e293b',
                700: '#334155',
              },
              lavender: {
                300: '#d8b4fe',
                400: '#c084fc',
                500: '#a855f7',
                600: '#9333ea',
              }
            },
            animation: {
              'spin-slow': 'spin 3s linear infinite',
              'bounce-short': 'bounce 0.5s infinite',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #020617; 
        color: #f8fafc;
      }
      .card-flip {
        transition: transform 0.6s;
        transform-style: preserve-3d;
      }
      .perspective-1000 {
        perspective: 1000px;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #a78bfa; 
      }
    </style>
